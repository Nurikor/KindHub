<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KindHub · Роль фонда</title>
  <link rel="stylesheet" href="./demo.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>
<body data-role="fund">
  <header class="header">
    <div class="container header-inner">
      <a href="./demo.html" class="back-link" data-i18n="back">← Назад к выбору роли</a>
      <div class="header-toolbar">
        <label class="visually-hidden" for="langSelect">Language</label>
        <select id="langSelect" class="lang-select" aria-label="Language">
          <option value="ru">Русский</option>
          <option value="en">English</option>
          <option value="kg">Кыргызча</option>
        </select>
        <button id="themeToggle" class="theme-btn" type="button" data-i18n="themeDark">Тёмная тема</button>
      </div>
    </div>
  </header>
  <main class="container">
    <section class="detail-card">
      <h1 data-i18n="fundTitle">Регистрация фонда · Бишкек</h1>
      <p class="muted" data-i18n="fundHint">После регистрации фонд может публиковать задачи для волонтеров и Безвоздмездников.</p>
      <div class="form-grid">
        <div class="field">
          <label for="fundNameInput" data-i18n="fundName">Название фонда</label>
          <input id="fundNameInput" placeholder="Например: Фонд поддержки семьи" />
        </div>
        <div class="field">
          <label for="fundDirectionInput" data-i18n="fundDirection">Направление</label>
          <input id="fundDirectionInput" placeholder="Незрячие, пожилые, семьи" />
        </div>
      </div>
      <div class="field">
        <label for="orgDocsInput" data-i18n="orgDocsLabel">Документы организации</label>
        <p class="field-hint muted" data-i18n="orgDocsHint">
          Загрузите файлы, подтверждающие регистрацию НКО: устав, свидетельство, ИНН (PDF или фото).
        </p>
        <input id="orgDocsInput" class="file-input" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,image/*,application/pdf" />
        <ul id="orgDocsList" class="doc-list"></ul>
      </div>
      <div class="inline-actions">
        <button id="fundRegisterBtn" class="btn-action" type="button" data-i18n="fundRegister">Подать регистрацию фонда</button>
      </div>
      <p id="fundStatus" class="muted"></p>
    </section>
  </main>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./role-page.js"></script>
</body>
</html>
