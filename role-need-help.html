<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KindHub · Нужна помощь</title>
  <link rel="stylesheet" href="./demo.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>
<body data-role="need-help">
  <header class="header">
    <div class="container header-inner">
      <a href="./demo.html" class="back-link" data-i18n="back">← Назад к выбору роли</a>
      <div class="header-toolbar">
        <label class="visually-hidden" for="langSelect">Language</label>
        <select id="langSelect" class="lang-select" aria-label="Language">
          <option value="ru">Русский</option>
          <option value="en">English</option>
          <option value="kg">Кыргызча</option>
        </select>
        <button id="themeToggle" class="theme-btn" type="button" data-i18n="themeDark">Тёмная тема</button>
      </div>
    </div>
  </header>
  <main class="container">
    <section class="detail-card">
      <h1 data-i18n="needTitle">Создание запроса на помощь · Бишкек</h1>
      <div class="form-grid">
        <div class="field">
          <label for="helpCategory" data-i18n="helpCategory">Категория помощи</label>
          <select id="helpCategory">
            <option value="blind" data-i18n="catBlind">Незрячие</option>
            <option value="local" data-i18n="catLocal">Локальная (местность)</option>
            <option value="home" data-i18n="catHome">Бытовая</option>
          </select>
        </div>
        <div class="field">
          <label for="helpText" data-i18n="descriptionLabel">Описание</label>
          <textarea id="helpText" placeholder="Опишите ситуацию и что нужно сделать"></textarea>
        </div>
      </div>
      <div class="inline-actions">
        <button id="createHelpBtn" class="btn-action" type="button" data-i18n="createRequest">Создать запрос</button>
      </div>
      <p id="formStatus" class="muted"></p>
      <div class="form-grid">
        <div class="field">
          <label for="attachRecipe" data-i18n="attachRecipe">Фото рецепта или списка (по желанию)</label>
          <input id="attachRecipe" class="file-input" type="file" accept="image/*,.pdf" />
        </div>
        <div class="field">
          <label for="attachPlace" data-i18n="attachPlace">Фото места встречи / ориентира (по желанию)</label>
          <input id="attachPlace" class="file-input" type="file" accept="image/*" />
        </div>
      </div>
    </section>
    <section class="detail-card">
      <h3 data-i18n="blindDepartment">Незрячий отдел</h3>
      <div class="blind-call-panel">
        <button class="btn-action big-action active-tab" data-blind-tab="all" type="button" data-i18n="blindAll">К волонтеру или Безвоздмезднику</button>
        <button class="btn-action big-action" data-blind-tab="vol" type="button" data-i18n="blindVol">Только к зарегистрированному волонтеру</button>
      </div>
      <p id="blindModeBadge" class="muted" data-i18n="blindModeAll">Режим: обратиться к волонтеру или Безвоздмезднику</p>
      <div class="field">
        <label for="blindText" data-i18n="blindMessage">Сообщение в незрячий отдел</label>
        <textarea id="blindText" placeholder="Например: помочь прочитать надпись через видеозвонок"></textarea>
      </div>
      <div class="field">
        <label for="blindExtraTask" data-i18n="blindExtraTask">Дополнительная задача</label>
        <textarea id="blindExtraTask" placeholder="Например: купить лекарства, продукты или помочь с доставкой"></textarea>
      </div>
      <div class="inline-actions">
        <button id="blindSendBtn" class="btn-action" type="button" data-i18n="sendBlindRequest">Отправить обращение</button>
      </div>
      <p id="blindStatus" class="muted"></p>
    </section>
    <section id="mapSection" class="detail-card">
      <h3 data-i18n="mapTitleNeed">Карта: укажите, где нужна помощь</h3>
      <div class="inline-actions">
        <button id="getLocationBtn" class="btn-action" type="button" data-i18n="allowGeo">Разрешить геолокацию</button>
        <a id="openMapsLink" class="btn-action" target="_blank" rel="noreferrer" href="https://www.google.com/maps" data-i18n="openGoogle">Открыть в Google Maps</a>
      </div>
      <p id="locationStatus" class="muted"></p>
      <div id="map" class="map-embed"></div>
    </section>
  </main>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./role-page.js"></script>
</body>
</html>
