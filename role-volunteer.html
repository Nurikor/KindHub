<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KindHub · Роль волонтера</title>
  <link rel="stylesheet" href="./demo.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>
<body data-role="volunteer">
  <header class="header">
    <div class="container header-inner">
      <a href="./demo.html" class="back-link" data-i18n="back">← Назад к выбору роли</a>
      <div class="header-toolbar">
        <label class="visually-hidden" for="langSelect">Language</label>
        <select id="langSelect" class="lang-select" aria-label="Language">
          <option value="ru">Русский</option>
          <option value="en">English</option>
          <option value="kg">Кыргызча</option>
        </select>
        <button id="themeToggle" class="theme-btn" type="button" data-i18n="themeDark">Тёмная тема</button>
      </div>
    </div>
  </header>
  <main class="container">
    <section class="detail-card">
      <h1 data-i18n="volTitle">Регистрация волонтера · Бишкек</h1>
      <div class="form-grid">
        <div class="field">
          <label for="personName" data-i18n="nameLabel">Имя</label>
          <input id="personName" maxlength="16" placeholder="Ваше имя" />
        </div>
        <div class="field">
          <label for="fundName" data-i18n="fundLabel">Фонд</label>
          <input id="fundName" placeholder="Фонд, где вы зарегистрированы" />
        </div>
        <div class="field">
          <label for="districtSelect" data-i18n="districtLabel">Район</label>
          <select id="districtSelect">
            <option value="">Выберите район</option>
            <option value="Ленинский">Ленинский</option>
            <option value="Октябрьский">Октябрьский</option>
            <option value="Первомайский">Первомайский</option>
            <option value="Свердловский">Свердловский</option>
          </select>
        </div>
      </div>
      <div class="inline-actions">
        <button id="registerBtn" class="btn-action" type="button" data-i18n="registerVolunteer">Зарегистрироваться как волонтер</button>
      </div>
      <p id="formStatus" class="muted"></p>
      <div class="field">
        <label for="avatarInput" data-i18n="uploadAvatar">Фото профиля</label>
        <p class="field-hint muted" data-i18n="uploadAvatarHint">Выберите своё фото — оно будет показано в профиле.</p>
        <input id="avatarInput" class="file-input" type="file" accept="image/*" />
        <div id="avatarPreview" class="upload-preview hidden" aria-live="polite"></div>
      </div>
    </section>
    <section id="taskSection" class="detail-card hidden">
      <h3 data-i18n="taskChecklist">Задания по местности (чек-лист)</h3>
      <p class="muted" data-i18n="volTaskHint">Для зарегистрированного волонтера доступны задания 1, 2 и 3.</p>
      <div id="taskGrid" class="task-grid"></div>
    </section>
    <section id="mapSection" class="detail-card hidden">
      <h3 data-i18n="mapTitle">Карта задач и местоположение</h3>
      <div class="inline-actions">
        <button id="getLocationBtn" class="btn-action" type="button" data-i18n="allowGeo">Разрешить геолокацию</button>
        <a id="openMapsLink" class="btn-action" target="_blank" rel="noreferrer" href="https://www.google.com/maps" data-i18n="openGoogle">Открыть в Google Maps</a>
      </div>
      <p id="locationStatus" class="muted"></p>
      <div id="map" class="map-embed"></div>
    </section>
  </main>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./role-page.js"></script>
</body>
</html>
